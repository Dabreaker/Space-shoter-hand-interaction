<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Void Commander</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/main.css" />
</head>
<body>

<!-- BOOT ──────────────────────────────────────────────────────────────────── -->
<div id="screen-boot" class="screen active">
  <div class="boot-grid"></div>
  <div class="boot-stars" id="bootStars"></div>
  <div class="boot-content">
    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <div class="logo-text">VOID<br><span>COMMANDER</span></div>
      <div class="logo-sub">NEURAL INTERFACE · HAND TRACKING EDITION</div>
    </div>
    <div class="boot-actions">
      <button class="btn-prime" onclick="App.goTo('hangar')">ENTER THE VOID</button>
      <button class="btn-ghost" onclick="App.goTo('store')">⚡ STORE</button>
      <button class="btn-ghost" onclick="App.goTo('leaderboard')">🏆 LEADERBOARD</button>
    </div>
    <div class="hud-credits-boot">
      <span class="label-small">CREDITS</span>
      <span id="boot-credits" class="credit-val">—</span>
    </div>
  </div>
</div>

<!-- HANGAR ────────────────────────────────────────────────────────────────── -->
<div id="screen-hangar" class="screen">
  <div class="hangar-bg"></div>
  <div class="hangar-header">
    <button class="btn-back" onclick="App.goTo('boot')">← BACK</button>
    <div class="section-title">HANGAR BAY</div>
    <div class="hud-credits-inline"><span>⚡</span><span id="hangar-credits">0</span></div>
  </div>
  <div class="ship-carousel" id="shipCarousel"></div>
  <div class="ship-detail-panel" id="shipDetail"></div>
  <div class="hangar-actions">
    <button class="btn-prime" id="launchBtn" onclick="App.launchGame()">🚀 LAUNCH</button>
    <button class="btn-secondary" id="buyShipBtn" style="display:none">BUY SHIP</button>
  </div>
</div>

<!-- GAME ───────────────────────────────────────────────────────────────────── -->
<div id="screen-game" class="screen">
  <div id="cam-wrap">
    <div class="scan-line"></div>
    <video id="input_video" autoplay muted playsinline></video>
    <div id="gesture-hud"></div>
  </div>
  <canvas id="gameCanvas"></canvas>

  <!-- Face scan countdown -->
  <div id="scan-countdown">
    <div class="scan-ring"></div>
    <div class="scan-label">PILOT SCAN</div>
    <div class="scan-number" id="scan-num">5</div>
    <div class="scan-sub">STAY IN FRAME</div>
  </div>

  <div id="hud">
    <div id="hud-left">
      <div class="hud-label">SHIELD</div>
      <div class="shield-bar-wrap"><div id="shieldBar" class="shield-bar"></div></div>
      <div id="shieldVal">100</div>
    </div>
    <div id="hud-center">
      <div id="hud-score-val">0</div>
      <div class="hud-label">SCORE</div>
      <div id="hud-wave">WAVE 1</div>
    </div>
    <div id="hud-right">
      <div class="hud-label">CREDITS</div>
      <div id="hud-credits">0</div>
      <div class="hud-label" style="margin-top:8px">KILLS</div>
      <div id="hud-kills">0</div>
    </div>
  </div>
  <div id="powerup-tray"></div>
  <div id="gesture-guide">
    <div class="gg-item"><span class="gg-icon">✋</span><span>OPEN = MOVE</span></div>
    <div class="gg-item"><span class="gg-icon">👆</span><span>1 FINGER = FIRE</span></div>
    <div class="gg-item"><span class="gg-icon">✌️</span><span>2 FINGERS = RAPID</span></div>
    <div class="gg-item"><span class="gg-icon">🤙</span><span>3 FINGERS = TRIPLE</span></div>
    <div class="gg-item"><span class="gg-icon">✊</span><span>FIST = BOMB</span></div>
  </div>
</div>

<!-- GAME OVER ──────────────────────────────────────────────────────────────── -->
<div id="screen-gameover" class="screen">
  <canvas id="goCanvas"></canvas>
  <div class="go-content">
    <div class="go-title">SHIP DESTROYED</div>
    <div id="go-pilot-frame" class="go-pilot-frame" style="display:none">
      <div class="go-pilot-label">▸ PILOT ID</div>
      <img id="go-pilot-photo" class="go-pilot-photo" alt="Pilot scan" />
    </div>
    <div class="go-stats" id="goStats"></div>
    <div class="go-achievements" id="goAchievements"></div>
    <div class="go-actions">
      <button class="btn-prime" onclick="App.launchGame()">RETRY</button>
      <button class="btn-ghost" onclick="App.goTo('store')">UPGRADE SHIP</button>
      <button class="btn-ghost" onclick="App.goTo('boot')">MAIN MENU</button>
    </div>
  </div>
</div>

<!-- STORE ──────────────────────────────────────────────────────────────────── -->
<div id="screen-store" class="screen">
  <div class="store-bg"></div>
  <div class="store-header">
    <button class="btn-back" onclick="App.goTo('boot')">← BACK</button>
    <div class="section-title">VOID MARKET</div>
    <div class="hud-credits-inline"><span>⚡</span><span id="store-credits">0</span></div>
  </div>
  <div class="store-tabs">
    <button class="tab-btn active" onclick="Store.switchTab('ships')">SHIPS</button>
    <button class="tab-btn" onclick="Store.switchTab('upgrades')">UPGRADES</button>
    <button class="tab-btn" onclick="Store.switchTab('powerups')">POWERUPS</button>
  </div>
  <div class="store-grid" id="storeGrid"></div>
  <div id="store-msg" class="store-msg"></div>
</div>

<!-- LEADERBOARD ────────────────────────────────────────────────────────────── -->
<div id="screen-leaderboard" class="screen">
  <div class="lb-header">
    <button class="btn-back" onclick="App.goTo('boot')">← BACK</button>
    <div class="section-title">VOID LEADERBOARD</div>
  </div>
  <div class="lb-list" id="lbList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="/game.js"></script>
<script src="/app.js"></script>
</body>
</html>
